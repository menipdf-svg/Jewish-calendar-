name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install fonts (Hebrew glyphs for screenshot tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core fonts-noto-core || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit + UI tests
        id: tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace
      - name: Publish screenshots branch
        if: always()
        run: |
          if ls app/build/screenshots/*.png >/dev/null 2>&1; then
            mkdir -p /tmp/shots && cp app/build/screenshots/*.png /tmp/shots/
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout --orphan ci-screenshots
            git rm -rf . -q || true
            cp /tmp/shots/*.png .
            git add *.png
            git commit -q -m "screenshots for $GITHUB_SHA"
            git push -f origin ci-screenshots
            git checkout -f "$GITHUB_SHA"
          fi
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/jewish-calendar.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jewish-calendar-apk
          path: out/jewish-calendar.apk
      - name: Publish release (latest)
        if: steps.tests.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: גרסה אחרונה
          body: "APK מעודכן, נבנה אוטומטית מ-main ועבר את הבדיקות. להתקנה: להוריד את jewish-calendar.apk ולאשר התקנה ממקורות לא ידועים."
          files: out/jewish-calendar.apk
          make_latest: true
      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
