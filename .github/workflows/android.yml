name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/jewish-calendar.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jewish-calendar-apk
          path: out/jewish-calendar.apk
      - name: Publish release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: גרסה אחרונה
          body: "APK מעודכן, נבנה אוטומטית מ-main. להתקנה: להוריד את jewish-calendar.apk ולאשר התקנה ממקורות לא ידועים."
          files: out/jewish-calendar.apk
          make_latest: true
