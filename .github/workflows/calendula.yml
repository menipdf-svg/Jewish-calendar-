name: Calendula Hebrew build

on:
  push:
    branches: [calendula]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch floret-kit (was a submodule)
        run: git clone --depth 1 https://codeberg.org/jlmakiola/floret-kit.git floret-kit
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0" || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/calendula-hebrew.apk
      - uses: actions/upload-artifact@v4
        with:
          name: calendula-hebrew-apk
          path: out/calendula-hebrew.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: calendula-hebrew-latest
          name: Calendula עברי - גרסה אחרונה
          body: "APK debug של Calendula (MIT) עם תאריך עברי וזמני הלכה. נבנה אוטומטית מהענף calendula."
          files: out/calendula-hebrew.apk
          make_latest: false
