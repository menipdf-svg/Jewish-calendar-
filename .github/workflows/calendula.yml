name: Calendula Hebrew build

on:
  push:
    branches: [calendula]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch floret-kit (was a submodule)
        run: git clone --depth 1 https://codeberg.org/jlmakiola/floret-kit.git floret-kit
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" --list --channel=3 2>/dev/null | grep -E "platforms;android-3[67]" || true
          PLAT=$("$SDKM" --list --channel=3 2>/dev/null | grep -oE "platforms;android-37[^ ]*" | head -1)
          echo "platform: $PLAT"
          "$SDKM" --channel=3 "${PLAT:-platforms;android-37}" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Diagnose APK
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          "$AAPT" dump badging app/build/outputs/apk/debug/*.apk | grep -E "^package|sdkVersion|targetSdk|native-code|uses-feature|compileSdk" || true
      - name: Diagnose signing and alignment
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK" | head -12 || true
          "$BT/zipalign" -c -P 16 -v 4 "$APK" | grep -E "lib/arm64|Verification" | head -10 || true
          "$BT/aapt2" dump badging "$APK" | grep -iE "minSdk|sdkVersion:|application-debuggable|extractNative|launchable" | head
          unzip -l "$APK" | grep -E "lib/arm64" | head
      - name: Build non-debuggable test APK (R8)
        run: ./gradlew assembleReleaseTest --no-daemon --stacktrace
      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/calendula-hebrew.apk
          cp app/build/outputs/apk/releaseTest/*.apk out/calendula-hebrew-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: calendula-hebrew-apk
          path: out/*.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: calendula-hebrew-latest
          name: Calendula עברי - גרסה אחרונה
          body: "APK debug של Calendula (MIT) עם תאריך עברי וזמני הלכה. נבנה אוטומטית מהענף calendula."
          files: |
            out/calendula-hebrew.apk
            out/calendula-hebrew-release.apk
          make_latest: false
